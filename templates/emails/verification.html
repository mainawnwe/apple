<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Verification code</title>
</head>
<body style="margin:0;padding:0;background:#0b0a1a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#0b0a1a;padding:40px 16px;">
    <tr>
      <td align="center">
        <table width="480" cellpadding="0" cellspacing="0" style="background:#17162e;border-radius:16px;padding:32px;border:1px solid rgba(255,255,255,0.08);">
          <tr>
            <td style="color:#e7e7f0;font-size:18px;font-weight:700;padding-bottom:8px;">
              ◈ Notes
            </td>
          </tr>
          <tr>
            <td style="color:#a3a3b8;font-size:14px;padding-bottom:24px;">
              {% if purpose == 'signup' %}
                Thanks for signing up, {{ username }}!
              {% else %}
                Password reset requested for {{ username }}.
              {% endif %}
            </td>
          </tr>
          <tr>
            <td style="color:#e7e7f0;font-size:14px;padding-bottom:12px;">
              Your verification code is:
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:16px 0 24px;">
              <div style="display:inline-block;background:linear-gradient(135deg,#a78bfa,#60a5fa);color:#fff;font-size:32px;font-weight:700;letter-spacing:8px;padding:16px 32px;border-radius:12px;">
                {{ code }}
              </div>
            </td>
          </tr>
          <tr>
            <td style="color:#64647e;font-size:12px;">
              This code expires in {{ ttl_minutes }} minutes.
              If you didn't request this, you can ignore this email.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
