<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="mark1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="mark2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="markGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#markGlow)">
    <!-- Left arrow chevron -->
    <path d="M60 15 L20 60 L60 105 L60 85 L40 60 L60 35 Z"
          fill="url(#mark1)"
          opacity="0.9"/>

    <!-- Right diamond (top-right + bottom-right) -->
    <path d="M60 15 L100 60 L60 105 L60 85 L80 60 L60 35 Z"
          fill="url(#mark2)"
          opacity="0.9"/>

    <!-- Inner diamond (hole) -->
    <path d="M60 38 L82 60 L60 82 L38 60 Z"
          fill="#0b0a1a"/>
  </g>
</svg>
